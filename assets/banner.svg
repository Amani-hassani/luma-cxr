<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Luma: externally validated chest X-ray AI research prototype">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a1f"/><stop offset="1" stop-color="#0d2a30"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.3" r="0.6"><stop offset="0" stop-color="#3fd6c1" stop-opacity="0.22"/><stop offset="1" stop-color="#3fd6c1" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd6c1" stop-opacity="0"/><stop offset="0.5" stop-color="#3fd6c1" stop-opacity="0.55"/><stop offset="1" stop-color="#3fd6c1" stop-opacity="0"/></linearGradient>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f3efe6"/><stop offset="0.45" stop-color="#f3efe6"/><stop offset="0.5" stop-color="#3fd6c1"/><stop offset="0.55" stop-color="#f3efe6"/><stop offset="1" stop-color="#f3efe6"/>
    <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="lungs"><rect x="70" y="60" width="170" height="180"/></clipPath>
</defs>
<style>
  .fade { }
  .beam { animation: scan 3.2s ease-in-out infinite alternate; }
  .lung { animation: breathe 4s ease-in-out infinite; transform-origin: 78px 90px; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(150px); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @media (prefers-reduced-motion: reduce) { .beam, .lung { animation: none; } }
</style>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#glow)"/>
<g transform="translate(70 70)"><g class="lung" fill="none" stroke="#3fd6c1" stroke-width="3" stroke-linecap="round">
  <path d="M78 10 V70 M78 70 C70 80 58 86 48 92 M78 70 C86 80 98 86 108 92"/>
  <path d="M66 30 C36 30 14 70 12 118 C11 140 26 152 46 146 C62 141 66 126 66 106 Z"/>
  <path d="M90 30 C120 30 142 70 144 118 C145 140 130 152 110 146 C94 141 90 126 90 106 Z"/>
</g></g>
<g clip-path="url(#lungs)"><rect class="beam" x="70" y="62" width="170" height="26" fill="url(#scan)"/></g>
<g class="fade" style="animation-delay:.1s"><text x="250" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="url(#txt)">Luma</text></g>
<g class="fade" style="animation-delay:.35s"><text x="252" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#9fc9c3" letter-spacing="1.5">EXTERNALLY VALIDATED CHEST X-RAY AI · RESEARCH PROTOTYPE</text></g>
<g class="fade" style="animation-delay:.6s"><text x="252" y="222" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#cfe3e0">Model locked before external testing · local inference · audit-logged application</text></g>
</svg>